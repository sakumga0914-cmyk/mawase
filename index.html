<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回せ。</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #f5f5f5;
  }

  canvas {
    display: block;
  }

  #controls {
    position: fixed;
    left: 50%;
    bottom: max(24px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.9);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    font-size: 13px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
    backdrop-filter: blur(10px);
  }

  #controls label {
    padding: 8px 12px;
    border-radius: 999px;
    background: #222;
    color: #fff;
    font-weight: 600;
    white-space: nowrap;
  }

  #photoInput {
    display: none;
  }

  #photoCount {
    white-space: nowrap;
    color: #555;
  }
</style>
</head>

<body>

<div id="controls">
  <label for="photoInput">写真を追加</label>
  <input id="photoInput" type="file" accept="image/*" multiple>
  <span id="photoCount">テスト画像 1枚 × 100</span>
  <select id="layoutMode" aria-label="配置">
    <option value="golden" selected>黄金角</option>
    <option value="rows">横ライン</option>
  </select>
  <select id="testCount" aria-label="テスト枚数">
    <option value="30">30枚</option>
    <option value="50">50枚</option>
    <option value="77">77枚</option>
    <option value="100" selected>100枚</option>
    <option value="150">150枚</option>
  </select>
</div>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f5f5);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.z = 4;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const photoInput = document.getElementById('photoInput');
const photoCount = document.getElementById('photoCount');
const testCount = document.getElementById('testCount');
const layoutMode = document.getElementById('layoutMode');
let currentTextures = [];
let usingUploadedPhotos = false;

// 球
const geometry = new THREE.SphereGeometry(0.85, 64, 48);

const material = new THREE.MeshPhysicalMaterial({
  color: 0xdff3dc,
  roughness: 0.28,
  metalness: 0.02,
  clearcoat: 0.65,
  clearcoatRoughness: 0.18
});

const sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);

// 写真を球面に配置
const cards = new THREE.Group();
scene.add(cards);

const defaultCount = 100;
const radius = 0.90;
const textureLoader = new THREE.TextureLoader();

function prepareTexture(texture) {
  texture.colorSpace = THREE.SRGBColorSpace;
  texture.minFilter = THREE.LinearMipmapLinearFilter;
  texture.magFilter = THREE.LinearFilter;
  texture.generateMipmaps = true;
  return texture;
}

function getTextureAspect(texture) {
  const image = texture.image;
  const width = image?.naturalWidth || image?.videoWidth || image?.width || 1;
  const height = image?.naturalHeight || image?.videoHeight || image?.height || 1;
  return width / height;
}

function getCardDimensions(texture, baseSize) {
  // 元画像の比率は守る。面積はだいたい揃えて、極端な縦長・横長だけ暴れを抑える。
  const aspect = THREE.MathUtils.clamp(getTextureAspect(texture), 0.42, 2.4);
  let width = baseSize * Math.sqrt(aspect);
  let height = baseSize / Math.sqrt(aspect);

  const maxLongSide = baseSize * 1.42;
  const longSide = Math.max(width, height);
  if (longSide > maxLongSide) {
    const scale = maxLongSide / longSide;
    width *= scale;
    height *= scale;
  }

  return { width, height };
}

function createPlacementPoints(total) {
  const points = [];
  const yLimit = 0.82;
  const goldenAngle = Math.PI * (3 - Math.sqrt(5));

  for (let i = 0; i < total; i++) {
    // 端点を避ける。極に寄せすぎると写真が詰まりやすいので、上下に少し逃げを作る。
    const y = yLimit - ((i + 0.5) / total) * (yLimit * 2);
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const theta = goldenAngle * i;

    points.push(new THREE.Vector3(
      Math.cos(theta) * r,
      y,
      Math.sin(theta) * r
    ));
  }

  return points;
}

function createRowPlacementPoints(total) {
  // 緯度ごとの横ライン配置。各段の枚数は、その緯度の円周に比例させる。
  const yLimit = 0.82;
  const approxRows = Math.max(3, Math.round(Math.sqrt(total * 0.8)));
  const rows = [];

  for (let row = 0; row < approxRows; row++) {
    const y = yLimit - ((row + 0.5) / approxRows) * (yLimit * 2);
    const ringRadius = Math.sqrt(Math.max(0, 1 - y * y));
    rows.push({ y, ringRadius, weight: ringRadius });
  }

  const weightSum = rows.reduce((sum, row) => sum + row.weight, 0);
  let counts = rows.map(row => Math.max(1, Math.floor(total * row.weight / weightSum)));
  let assigned = counts.reduce((a, b) => a + b, 0);

  while (assigned < total) {
    let best = 0;
    let bestScore = -Infinity;
    for (let i = 0; i < rows.length; i++) {
      const ideal = total * rows[i].weight / weightSum;
      const score = ideal - counts[i];
      if (score > bestScore) {
        bestScore = score;
        best = i;
      }
    }
    counts[best]++;
    assigned++;
  }

  while (assigned > total) {
    let best = -1;
    let bestScore = Infinity;
    for (let i = 0; i < rows.length; i++) {
      if (counts[i] <= 1) continue;
      const ideal = total * rows[i].weight / weightSum;
      const score = ideal - counts[i];
      if (score < bestScore) {
        bestScore = score;
        best = i;
      }
    }
    if (best < 0) break;
    counts[best]--;
    assigned--;
  }

  const points = [];
  rows.forEach((row, rowIndex) => {
    const count = counts[rowIndex];
    // 一段おきに半コマずらして、縦の一直線感だけは弱める。
    const offset = (rowIndex % 2) * Math.PI / count;
    for (let j = 0; j < count; j++) {
      const theta = (j / count) * Math.PI * 2 + offset;
      points.push(new THREE.Vector3(
        Math.cos(theta) * row.ringRadius,
        row.y,
        Math.sin(theta) * row.ringRadius
      ));
    }
  });

  return points.slice(0, total);
}

function estimateCardSize(points) {
  if (points.length <= 1) return 0.34;

  const nearestDistances = points.map((point, index) => {
    let nearest = Infinity;

    points.forEach((other, otherIndex) => {
      if (index === otherIndex) return;
      const distance = point.distanceTo(other) * radius;
      nearest = Math.min(nearest, distance);
    });

    return nearest;
  }).sort((a, b) => a - b);

  const medianNearest = nearestDistances[Math.floor(nearestDistances.length / 2)];

  // 正方形固定より見た目の幅が増えるので、少しだけ控えめにする。
  return THREE.MathUtils.clamp(medianNearest * 0.82, 0.13, 0.31);
}

// 平面ではなく、球面に沿う小さな湾曲パッチを作る。写真比率はここで保持する。
function createCurvedCardGeometry(center, cardWidth = 0.235, cardHeight = 0.235, segments = 8) {
  const normal = center.clone().normalize();
  const helper = Math.abs(normal.y) > 0.9
    ? new THREE.Vector3(1, 0, 0)
    : new THREE.Vector3(0, 1, 0);
  const tangentX = new THREE.Vector3().crossVectors(helper, normal).normalize();
  const tangentY = new THREE.Vector3().crossVectors(normal, tangentX).normalize();

  const positions = [];
  const uvs = [];
  const indices = [];
  const cardLift = 0.008;
  const surfaceRadius = radius + cardLift;

  for (let iy = 0; iy <= segments; iy++) {
    const v = iy / segments;
    const dy = (v - 0.5) * cardHeight;

    for (let ix = 0; ix <= segments; ix++) {
      const u = ix / segments;
      const dx = (u - 0.5) * cardWidth;

      const point = normal.clone()
        .addScaledVector(tangentX, dx)
        .addScaledVector(tangentY, dy)
        .normalize()
        .multiplyScalar(surfaceRadius);

      positions.push(point.x, point.y, point.z);
      uvs.push(u, v);
    }
  }

  for (let iy = 0; iy < segments; iy++) {
    for (let ix = 0; ix < segments; ix++) {
      const a = iy * (segments + 1) + ix;
      const b = a + 1;
      const c = a + segments + 1;
      const d = c + 1;
      indices.push(a, c, b, b, c, d);
    }
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geometry.setIndex(indices);
  geometry.computeVertexNormals();
  return geometry;
}

function clearCards() {
  while (cards.children.length) {
    const card = cards.children.pop();
    card.geometry.dispose();
    card.material.dispose();
  }
}

function buildCards(textures, targetCount = textures.length) {
  clearCards();

  const total = Math.max(1, targetCount);
  const points = layoutMode.value === 'rows'
    ? createRowPlacementPoints(total)
    : createPlacementPoints(total);
  const baseCardSize = estimateCardSize(points);

  for (let i = 0; i < total; i++) {
    const texture = textures[i % textures.length];
    const { width, height } = getCardDimensions(texture, baseCardSize);

    const cardMaterial = new THREE.MeshBasicMaterial({
      map: texture,
      side: THREE.DoubleSide
    });

    // 写真そのものを球面に沿わせる。元比率は守り、正方形へ押し込まない。
    const center = points[i].clone().multiplyScalar(radius);
    const curvedGeometry = createCurvedCardGeometry(center, width, height);
    const card = new THREE.Mesh(curvedGeometry, cardMaterial);

    // 外周の「紙感」を抑えるため、球面上の向きを保持する。
    // 正面では写真本来の明るさ、横を向くほど暗くする（透明にはしない）。
    card.userData.surfaceNormal = points[i].clone().normalize();
    cards.add(card);
  }
}

textureLoader.load('./DSC_0034.jpeg', texture => {
  currentTextures = [prepareTexture(texture)];
  buildCards(currentTextures, defaultCount);
});

function rebuildComparison() {
  if (!currentTextures.length) return;
  const count = Number(testCount.value);
  buildCards(currentTextures, count);
  photoCount.textContent = usingUploadedPhotos
    ? currentTextures.length + '枚の写真 → ' + count + 'マスで比較'
    : 'テスト画像 1枚 × ' + count;
}

testCount.addEventListener('change', rebuildComparison);
layoutMode.addEventListener('change', rebuildComparison);

photoInput.addEventListener('change', async event => {
  const files = Array.from(event.target.files || []).filter(file => file.type.startsWith('image/'));
  if (!files.length) return;

  const textures = await Promise.all(files.map(file => new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    textureLoader.load(url, texture => {
      URL.revokeObjectURL(url);
      resolve(prepareTexture(texture));
    }, undefined, error => {
      URL.revokeObjectURL(url);
      reject(error);
    });
  })));

  // 実写真を読み込んだ直後は、選んだ枚数そのままで表示する。
  currentTextures = textures;
  usingUploadedPhotos = true;
  buildCards(textures, textures.length);
  photoCount.textContent = files.length + '枚 → 球面' + files.length + '枚';
  photoInput.value = '';
});

// 光
const mainLight = new THREE.DirectionalLight(0xffffff, 3);
mainLight.position.set(3, 4, 5);
scene.add(mainLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);

// 回せ。
let time = 0;

function animate() {
  requestAnimationFrame(animate);

  time += 0.01;

  // ゆっくり横回転
  sphere.rotation.y += 0.006;
  cards.rotation.y += 0.006;

  // X軸で前後に±20°、Z軸で左右に±10°。全球感を残しつつ、動きすぎを少し抑える。
  const tiltX = Math.sin(time * 0.22) * THREE.MathUtils.degToRad(20);
  const tiltZ = Math.cos(time * 0.18) * THREE.MathUtils.degToRad(10);

  sphere.rotation.x = tiltX;
  cards.rotation.x = tiltX;

  sphere.rotation.z = tiltZ;
  cards.rotation.z = tiltZ;

  // カメラに対して横向きになった写真だけを暗くする。
  // 正面の写真は brightness=1.0 のままなので、写真自体は薄くならない。
  const groupQuaternion = cards.getWorldQuaternion(new THREE.Quaternion());
  const worldNormal = new THREE.Vector3();

  cards.children.forEach(card => {
    worldNormal
      .copy(card.userData.surfaceNormal)
      .applyQuaternion(groupQuaternion);

    // camera は +Z 側。正面ほど 1、外周ほど 0、裏側は負になる。
    const facing = worldNormal.z;
    const frontness = THREE.MathUtils.smoothstep(facing, 0.05, 0.72);
    const brightness = THREE.MathUtils.lerp(0.52, 1.0, frontness);

    card.material.color.setScalar(brightness);
  });

  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
