<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>回せ。</title>

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #f5f5f5;
  }

  canvas {
    display: block;
  }
</style>
</head>

<body>

<script type="module">
import * as THREE from
'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf5f5f5);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);
camera.position.z = 4;

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

// 球
const geometry = new THREE.SphereGeometry(0.85, 64, 48);

const material = new THREE.MeshStandardMaterial({
  color: 0xdddddd,
  roughness: 0.65,
  metalness: 0
});

const sphere = new THREE.Mesh(geometry, material);
scene.add(sphere);
  // 写真の代役カード
const cardGeometry = new THREE.PlaneGeometry(0.35, 0.35);

const texture = new THREE.TextureLoader().load('./DSC_0034.jpeg');

const cardMaterial = new THREE.MeshBasicMaterial({
  map: texture,
  side: THREE.DoubleSide
});

const card = new THREE.Mesh(cardGeometry, cardMaterial);

// 球の表面に置く
card.position.set(0, 0, 1.30);

// 球と一緒に回す
scene.add(card);

// 光
const mainLight = new THREE.DirectionalLight(0xffffff, 3);
mainLight.position.set(3, 4, 5);
scene.add(mainLight);

const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);

// 回せ。
function animate() {
  requestAnimationFrame(animate);

  sphere.rotation.y += 0.012;

const angle = sphere.rotation.y;
card.position.x = Math.sin(angle) * 0.88;
card.position.z = Math.cos(angle) * 0.88;
card.rotation.y = angle;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
